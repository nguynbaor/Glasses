name: Deploy ASP.NET Core to Somee

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Đổi thành '6.0.x' hoặc '7.0.x' nếu dự án dùng bản cũ hơn

      - name: 3. Restore & Publish ứng dụng
        run: |
          dotnet restore
          dotnet publish -c Release -o ./publish

      - name: 4. Upload lên Somee qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./publish/
          server-dir: ./www.Nhom6LTW.somee.com/
